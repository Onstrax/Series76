# Series 76 backend — runtime services db / api / worker; api and worker run from ONE
# image (Req 1.4, 12.1). No secret is baked into the image; all config is injected
# from the environment (env_file: .env).
#
# `migrate` is a one-shot job, not a runtime service: it runs Alembic to head,
# provisions the least-privilege application login named in DATABASE_URL (granted
# app_writer + runtime_reader_role), publishes the audited catalog edition through
# verified_replay (hash-checked, no model call, idempotent; a no-op until the audit
# manifest exists), then exits. api/worker start only after it
# completed successfully (Req 12.2), so a failed migration never serves. Only this job
# holds the privileged migration URL; the serving processes never see it.

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: series76
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: series76
    volumes:
      - series76_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U series76 -d series76"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: series76-backend:latest
    env_file:
      - .env
    environment:
      # Migrations + provisioning run with the privileged owner; the app never does.
      SERIES76_MIGRATE_URL: postgresql+psycopg://series76:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/series76
    command:
      - sh
      - -c
      - alembic upgrade head && python -m series76_api.provision && python -m series76_data publish && python -m series76_api.seed --demo
    depends_on:
      db:
        condition: service_healthy

  api:
    image: series76-backend:latest
    env_file:
      - .env
    environment:
      SERIES76_MIGRATE_URL: ""
      COST_LEDGER_PATH: /var/lib/series76/cost_ledger.jsonl
    volumes:
      - series76_ledger:/var/lib/series76
    command:
      - uvicorn
      - series76_api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: series76-backend:latest
    env_file:
      - .env
    environment:
      SERIES76_MIGRATE_URL: ""
      COST_LEDGER_PATH: /var/lib/series76/cost_ledger.jsonl
    volumes:
      - series76_ledger:/var/lib/series76
    command: ["python", "-m", "series76_api.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  series76_pgdata:
  # One cumulative cost ledger shared by api + worker (USD 10 / 6 / 4 policy).
  series76_ledger:
