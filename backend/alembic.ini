# Alembic configuration for the Series 76 data-and-ingestion slice (Spec 1).
#
# The database URL is NOT stored here. ``migrations/env.py`` reads it from the
# ``SERIES76_MIGRATE_URL`` environment variable, falling back to
# ``DATABASE_URL``. This keeps credentials out of version control and lets the
# integration tests point migrations at the ephemeral PostgreSQL container.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# ``sqlalchemy.url`` is intentionally left blank; env.py resolves it at runtime.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
